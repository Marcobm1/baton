<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% block refresh %}<meta http-equiv="refresh" content="300">{% endblock %}
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ css_v }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="mark">◆</span> {{ title }}</a>
    <nav>
      <a href="/" {% if nav == 'projects' %}aria-current="page"{% endif %}>{{ t.projects }}</a>
      <a href="/tasks" {% if nav == 'tasks' %}aria-current="page"{% endif %}>{{ t.tasks_nav }}</a>
      <a href="/quotas" {% if nav == 'quotas' %}aria-current="page"{% endif %}>{{ t.quotas }}</a>
    </nav>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer>Baton {{ version }} · <a href="https://github.com/Marcobm1/baton">github.com/Marcobm1/baton</a></footer>
</body>
</html>

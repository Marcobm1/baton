<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{ title }}">
  <title>{{ t.auth_title }} — {{ title }}</title>
  <script>
    (function () {
      var d = document.documentElement, theme = "auto";
      d.classList.add("js");
      try { theme = localStorage.getItem("baton-theme") || "auto"; } catch (e) {}
      if (theme === "light" || theme === "dark") d.dataset.theme = theme;
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/static/huo-icon.svg?v={{ css_v }}">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v={{ css_v }}">
  <link rel="stylesheet" href="/static/style.css?v={{ css_v }}">
</head>
<body>
<div class="login-shell">
  <section class="login-card">
    <div class="brand">
      <span class="mark" aria-hidden="true"><img class="mark-img" src="/static/huo-icon.svg?v={{ css_v }}" alt="" width="34" height="34"></span>
      <span class="brand-text"><span class="brand-name">{{ title }}</span><span class="brand-version">v{{ version }}</span></span>
    </div>
    <h1>{{ t.auth_heading }}</h1>
    <p class="muted small">{{ t.auth_hint }}</p>
    {% if error %}<p class="error-box" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="csrf" value="{{ login_csrf }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="access-key">{{ t.auth_key_label }}</label>
      <input id="access-key" name="key" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="btn primary">{{ t.auth_submit }}</button>
    </form>
  </section>
</div>
</body>
</html>

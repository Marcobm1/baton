<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Huo">
  <defs>
    <linearGradient id="huo-bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#152b25"/>
      <stop offset="100%" stop-color="#091310"/>
    </linearGradient>
    <radialGradient id="huo-glow" cx="26" cy="36" r="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="huo-paper" x1="29" y1="9" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="huo-flame" x1="32" y1="8" x2="32" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="38%" stop-color="#34d399"/>
      <stop offset="85%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="huo-face" x1="32" y1="22" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c3b2e"/>
      <stop offset="100%" stop-color="#06211a"/>
    </linearGradient>
  </defs>

  <!-- Obsidian-jade squircle frame -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#huo-bg)" stroke="#235243" stroke-width="2"/>
  <circle cx="26" cy="36" r="23" fill="url(#huo-glow)"/>

  <!-- Taoist talisman (Ten-Lords Commission / Talisman: Protection) peeking behind Mr. Tail -->
  <g transform="rotate(9 41 31)">
    <rect x="29" y="10" width="22.5" height="41" rx="3.4" fill="url(#huo-paper)" stroke="#92400e" stroke-width="1.2"/>
    <rect x="32" y="13" width="16.5" height="35" rx="1.6" fill="none" stroke="#b91c1c" stroke-width="1.35"/>
    <!-- Vermilion seal diamond + Li trigram (☲ = Fire) -->
    <path d="M37 18 L40.25 15.6 L43.5 18 L40.25 20.4 Z" fill="#b91c1c"/>
    <line x1="35" y1="24" x2="45.5" y2="24" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="28.8" x2="38.8" y2="28.8" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
    <line x1="41.7" y1="28.8" x2="45.5" y2="28.8" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="33.6" x2="45.5" y2="33.6" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
    <path d="M40.25 37.8 L40.25 43.6 M37.6 40.7 L42.9 40.7" stroke="#b91c1c" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <!-- Mischievous Mr. Tail spectral fox-flame in front -->
  <g transform="translate(-4.6, 3.2) scale(0.90)">
    <path
      d="M30.5 54
         C20.0 54 13.0 47.2 13.0 38.2
         C13.0 31.8 16.5 26.6 16.8 22.0
         C15.2 17.6 15.8 13.0 18.0 10.6
         C22.0 12.6 25.0 16.2 26.6 20.0
         C28.4 14.8 31.8 10.2 35.6 8.2
         C36.2 12.6 37.2 16.6 38.4 20.0
         C40.4 16.2 43.2 13.0 46.8 11.4
         C48.8 14.2 49.0 18.6 47.6 22.8
         C49.4 27.2 51.0 32.2 51.0 37.8
         C51.0 47.0 43.0 54 30.5 54 Z"
      fill="url(#huo-flame)" stroke="#091511" stroke-width="2.0" stroke-linejoin="round"
    />
    <path
      d="M32 48.5
         C24.6 48.5 19.6 43.8 19.6 37.4
         C19.6 32.2 23.2 27.6 27.6 24.4
         C29.0 26.8 30.6 28.0 32.2 28.6
         C33.6 26.0 35.2 23.8 36.8 22.6
         C41.2 26.2 44.4 31.6 44.4 37.4
         C44.4 43.8 39.4 48.5 32 48.5 Z"
      fill="url(#huo-face)"
    />
    <!-- Iconic glowing golden slanted Mr. Tail eyes -->
    <path d="M23.2 34.8 Q27.2 34.4 30.2 38.4 Q26.4 39.8 23.2 34.8 Z" fill="#fde047"/>
    <path d="M40.8 34.8 Q36.8 34.4 33.8 38.4 Q37.6 39.8 40.8 34.8 Z" fill="#fde047"/>
    <!-- Mischievous smirk -->
    <path d="M28.6 43.0 Q32 45.2 35.4 43.0" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>

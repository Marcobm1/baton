<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="300">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="mark">◆</span> {{ title }}</a>
    <nav>
      <a href="/#quotas">{{ t.quotas }}</a>
      <a href="/#projects">{{ t.projects }}</a>
      <a class="btn" href="/?refresh=1">{{ t.refresh }}</a>
    </nav>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer>Baton {{ version }} · <a href="https://github.com/Marcobm1/baton">github.com/Marcobm1/baton</a></footer>
</body>
</html>

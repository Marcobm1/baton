[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "baton-hub"
version = "0.1.0"
description = "A shared project hub for you and your AI agents: STATUS.md files from your GitHub repos in one page, plus your Claude/Codex quota windows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "httpx==0.28.1",
  "pyyaml==6.0.4",
  "markdown-it-py==4.3.0",
  "python-multipart==0.0.34",
  "psutil==7.2.2",
  "ai-townhall @ git+https://github.com/Marcobm1/townhall.git@bc8ba08e0fc2b5085891d13e2b58700874278a56",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[project.scripts]
baton = "baton.__main__:main"

[tool.setuptools]
packages = ["baton"]

[tool.setuptools.package-data]
baton = ["templates/*.html", "static/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
